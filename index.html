<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf3e8">
<title>软软小游戏</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;background:#fbf3e8;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:#7a5c58;}
body{padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;align-items:center;}
h1{margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:3px;color:#c9817a;text-shadow:0 2px 0 #fff,0 4px 12px rgba(201,129,122,.22);}
.sub{margin:0 0 28px;font-size:13px;color:#a88a84;}
.grid{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;}
.card{display:block;text-decoration:none;color:inherit;background:rgba(255,252,247,.95);border-radius:28px;padding:22px 22px 20px;box-shadow:0 12px 28px rgba(190,140,120,.18),inset 0 -3px 0 rgba(245,225,212,.9);transition:transform .2s ease,box-shadow .2s ease;}
.card:active{transform:scale(.98);box-shadow:0 6px 16px rgba(190,140,120,.15);}
.card .icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.04);}
.card h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:1px;}
.card p{margin:0;font-size:13px;color:#a88a84;line-height:1.5;}
.card.yarn .icon{background:linear-gradient(160deg,#f6d0c8,#ecc0b8);}
.card.yarn h2{color:#d98a7e;}
.card.goose .icon{background:linear-gradient(160deg,#e8d8c8,#d8c0a8);}
.card.goose h2{color:#c4a078;}
.card.sheep .icon{background:linear-gradient(160deg,#d8cce8,#c8b8e0);}
.card.sheep h2{color:#a898c8;}
.foot{margin-top:28px;font-size:12px;color:#c0a8a0;}
svg{display:block;}
</style>
</head>
<body>
<h1>软软小游戏</h1>
<p class="sub">选一个，轻轻玩一会儿～</p>
<div class="grid">
  <a class="card yarn" href="/yarn/">
    <div class="icon">
      <svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="#f0b8b0"/><circle cx="18" cy="18" r="7" fill="none" stroke="#fff8f4" stroke-width="2.5"/><circle cx="18" cy="18" r="3" fill="#e89890"/></svg>
    </div>
    <h2>解毛线</h2>
    <p>拖动毛线球，把交叉的线全部解开</p>
  </a>
  <a class="card goose" href="/goose/">
    <div class="icon">
      <svg width="36" height="36" viewBox="0 0 36 36"><ellipse cx="19" cy="22" rx="10" ry="7" fill="#f0e0d0"/><circle cx="12" cy="14" r="6" fill="#f0e0d0"/><path d="M6 14 Q2 16 4 18 Q8 16 10 15" fill="#e8c4a8"/><circle cx="10" cy="12.5" r="1.2" fill="#6a5a50"/></svg>
    </div>
    <h2>抓大鹅</h2>
    <p>点最上面的小物件，三个相同就能消掉</p>
  </a>
  <a class="card sheep" href="/sheep/">
    <div class="icon">
      <svg width="36" height="36" viewBox="0 0 36 36"><rect x="6" y="8" width="24" height="22" rx="6" fill="#efe8dc"/><circle cx="18" cy="19" r="7" fill="#e8e0d4"/><circle cx="13" cy="14" r="3" fill="#e8e0d4"/><circle cx="23" cy="14" r="3" fill="#e8e0d4"/><circle cx="15.5" cy="18" r="1.1" fill="#6a5a50"/><circle cx="20.5" cy="18" r="1.1" fill="#6a5a50"/></svg>
    </div>
    <h2>羊了个羊</h2>
    <p>翻开没被挡住的牌，消消乐过关</p>
  </a>
</div>
<p class="foot">画风软软的，不刺眼哦</p>
</body>
</html>
